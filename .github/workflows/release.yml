name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate manifest version matches tag
        run: |
          MANIFEST_VER=$(jq -r .version manifest.json)
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VER" != "$TAG_VER" ]; then
            echo "Error: manifest.json version ($MANIFEST_VER) does not match tag ($TAG_VER)"
            exit 1
          fi

      - name: Package extension
        run: |
          mkdir -p dist
          tar czf "dist/gdstudio_v${{ steps.version.outputs.version }}.alix" manifest.json index.js icon.png

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: |
            dist/gdstudio_v${{ steps.version.outputs.version }}.alix
          generate_release_notes: true
