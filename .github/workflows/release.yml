name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate manifest version matches tag
        run: |
          MANIFEST_VER=$(jq -r .version manifest.json)
          TAG_VER="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VER" != "$TAG_VER" ]; then
            echo "Error: manifest.json version ($MANIFEST_VER) does not match tag ($TAG_VER)"
            exit 1
          fi

      - name: Package extension
        run: |
          mkdir -p dist
          tar czf "dist/gdstudio_v${{ steps.version.outputs.version }}.alix" manifest.json index.js

      - name: Generate version.json
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/gdstudio_v${{ steps.version.outputs.version }}.alix"
          cat > dist/version.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "download_url": "$DOWNLOAD_URL",
            "log": "${{ github.event.head_commit.message }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          }
          EOF

      - name: Update repo version.json
        run: cp dist/version.json version.json

      - name: Commit and push version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json to v${{ steps.version.outputs.version }}" || true
          git push origin HEAD:main || git push origin HEAD:master

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: |
            dist/gdstudio_v${{ steps.version.outputs.version }}.alix
          generate_release_notes: true
